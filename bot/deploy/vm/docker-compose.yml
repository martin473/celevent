# Free hosting option 2: everything (loop, Jetstream, custom feed, hosted
# OAuth, /healthz) on a free VM, e.g. a Google Cloud e2-micro.
#
#   cd celevent/bot/deploy/vm
#   cp ../../.env.example ../../.env    # fill in; DATABASE_URL can be Neon
#   DOMAIN=<VM-IP-with-dashes>.sslip.io docker compose up -d --build
#
# Caddy gets a free Let's Encrypt certificate for DOMAIN automatically.
# sslip.io maps 34-123-45-67.sslip.io to 34.123.45.67, so no domain purchase
# is needed. Set PUBLIC_URL=https://$DOMAIN in .env.
services:
  bot:
    build: ../..
    env_file: ../../.env
    environment:
      PORT: "8080"
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 120s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. 34-123-45-67.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [bot]

  # Restarts the bot when its health check keeps failing (Docker alone doesn't).
  autoheal:
    image: willfarrell/autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  caddy-data:
