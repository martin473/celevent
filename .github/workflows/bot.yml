name: celevent-bot

on:
  push:
    paths: ["bot/**", ".github/workflows/bot.yml"]
  pull_request:
    paths: ["bot/**", ".github/workflows/bot.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: celevent
          POSTGRES_PASSWORD: celevent
          POSTGRES_DB: celevent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U celevent"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://celevent:celevent@localhost:5432/celevent

  # Deploys main to Fly.io after tests pass, once a FLY_API_TOKEN repo secret exists.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-bot
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - name: Check for Fly token
        id: fly
        run: echo "enabled=${{ secrets.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.fly.outputs.enabled == 'true'
      - run: flyctl deploy --remote-only
        if: steps.fly.outputs.enabled == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
